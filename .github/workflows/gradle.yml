# To get a newer version, you will need to update the SHA.
# You can also reference a tag or branch, but the action may change without warning.

name: Java CI

on: [push]

permissions:
  checks: write

env:
  GEMINI_API_KEY : ${{ secrets.GEMINI_API_KEY }}

jobs:
  build:
    strategy:
        matrix:
          java_version: [17, 21, 25]
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Set up JDK ${{ matrix.java_version }}
        uses: actions/setup-java@v5.4.0
        with:
          java-version: ${{ matrix.java_version }}
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"
      - name: Build with Gradle
        run: ./gradlew ktlintFormat
      - name: Run jvm tests
        run: ./gradlew jvmTest -x detekt
      - name: Prepare jsNodeTest
        run: ./gradlew kotlinUpgradeYarnLock 
      - name: Run jsNodeTest
        run: ./gradlew jsNodeTest jacoco -x detekt
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: takanori-ugai/Gemini4KT
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6.4.2
        if: success() || failure() # always run even if the previous step fails
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
          include_passed: true
